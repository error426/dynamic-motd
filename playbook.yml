---
- name: Install dynamic motd
  hosts: all
  become: true
  strategy: linear
  vars:
    motd_repo: https://github.com/error426/dynamic-motd.git
    motd_version: main
    motd_packages:
      - lsb-release
      - python3-utmp
      - bc
    # Used by 50-services-need-restart, not required
    motd_optional_packages:
      - debian-goodies
      - needrestart
    motd_install_optional: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ motd_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install optional packages
      ansible.builtin.apt:
        name: "{{ motd_optional_packages }}"
        state: present
      when: motd_install_optional | bool

    - name: Create update-motd.d directory
      ansible.builtin.file:
        path: /etc/update-motd.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Clone on the controller so target servers do not need git
    - name: Install update-motd.d scripts from git
      block:
        - name: Create temporary directory on controller
          ansible.builtin.tempfile:
            state: directory
            path: /tmp
            prefix: dynamic-motd.
          register: motd_tmp
          delegate_to: localhost
          run_once: true  # noqa: run-once[task]
          become: false

        - name: Clone repository on controller
          ansible.builtin.git:
            repo: "{{ motd_repo }}"
            version: "{{ motd_version }}"
            dest: "{{ motd_tmp.path }}/repo"
            depth: 1
            single_branch: true
          delegate_to: localhost
          run_once: true  # noqa: run-once[task]
          become: false

        - name: Copy update-motd.d scripts to target
          ansible.builtin.copy:
            src: "{{ motd_tmp.path }}/repo/update-motd.d/"
            dest: /etc/update-motd.d/
            owner: root
            group: root
            mode: preserve

      always:
        - name: Remove temporary directory on controller
          ansible.builtin.file:
            path: "{{ motd_tmp.path }}"
            state: absent
          when: motd_tmp.path is defined
          delegate_to: localhost
          run_once: true  # noqa: run-once[task]
          become: false

    - name: Check current /etc/motd
      ansible.builtin.stat:
        path: /etc/motd
      register: motd_stat

    - name: Back up static /etc/motd to /etc/motd-dist
      ansible.builtin.copy:
        src: /etc/motd
        dest: /etc/motd-dist
        remote_src: true
        force: false
        mode: preserve
      when: motd_stat.stat.exists and motd_stat.stat.isreg

